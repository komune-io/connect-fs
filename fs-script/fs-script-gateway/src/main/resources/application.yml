server:
  port: 1001

fs:
  script:
    retry:
      max: 3
      delayMillis: 5000
    init:
      sources:
        - ${FS_SCRIPT_INIT_SOURCES:infra/docker-compose/data/test-import}
    s3:
      internalUrl: ${FS_S3_INTERNAL_URL:http://localhost:9000}
      externalUrl: ${FS_S3_EXTERNAL_URL:http://localhost:9000}
      username: ${FS_S3_USERNAME:minio}
      password: ${FS_S3_PASSWORD:minio123}
    migrate:
      enabled: ${FS_SCRIPT_MIGRATE_ENABLED:false}
      dryRun: ${FS_SCRIPT_MIGRATE_DRY_RUN:false}
      buckets: ${FS_SCRIPT_MIGRATE_BUCKETS:}
      concurrency: ${FS_SCRIPT_MIGRATE_CONCURRENCY:8}
      deleteExtraneous: ${FS_SCRIPT_MIGRATE_DELETE_EXTRANEOUS:false}
      source:
        internalUrl: ${FS_MIGRATE_SOURCE_URL:}
        username: ${FS_MIGRATE_SOURCE_USERNAME:}
        password: ${FS_MIGRATE_SOURCE_PASSWORD:}
